<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Gridline Syndicate</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; touch-action: none; }
        canvas { width: 100vw; height: 100vh; display: block; }
        .controls {
            position: absolute; bottom: 25px; width: 100%;
            display: flex; justify-content: space-between; padding: 0 25px; box-sizing: border-box;
        }
        .btn {
            width: 70px; height: 70px; background: rgba(255, 255, 255, 0.4);
            border: 2px solid #fff; border-radius: 50%; font-size: 24px; color: #fff;
            display: flex; align-items: center; justify-content: center; user-select: none;
        }
    </style>
    <script src="https://code.playcanvas.com/playcanvas-stable.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <canvas id="application"></canvas>
    <div class="controls">
        <div id="leftBtn" class="btn">◀</div>
        <div id="rightBtn" class="btn">▶</div>
        <div id="gasBtn" class="btn">▲</div>
    </div>
    <script>
        const socket = io();
        const canvas = document.getElementById('application');
        const app = new pc.Application(canvas, {
            mouse: new pc.Mouse(canvas),
            touch: new pc.TouchDevice(canvas)
        });
        app.setCanvasFillMode(pc.FILLMODE_FILL_WINDOW);
        app.setCanvasResolution(pc.RESOLUTION_AUTO);
        app.start();

        const light = new pc.Entity('light');
        light.addComponent('light', { type: 'directional', color: new pc.Color(1, 1, 1), castShadows: true });
        light.setEulerAngles(45, 30, 0);
        app.root.addChild(light);

        const ground = new pc.Entity('ground');
        ground.addComponent('render', { type: 'box' });
        ground.setLocalScale(300, 1, 300);
        ground.setLocalPosition(0, -0.5, 0);
        app.root.addChild(ground);

        const car = new pc.Entity('carPlayer');
        car.addComponent('render', { type: 'box' });
        car.setLocalScale(2, 1, 4);
        car.setLocalPosition(0, 0.5, 0);
        app.root.addChild(car);

        const carMaterial = new pc.StandardMaterial();
        carMaterial.diffuse = new pc.Color(0.8, 0.1, 0.1);
        carMaterial.metalness = 0.8;
        carMaterial.shininess = 60;
        carMaterial.update();
        car.render.meshInstances[0].material = carMaterial;

        const camera = new pc.Entity('camera');
        camera.addComponent('camera', { clearColor: new pc.Color(0.5, 0.7, 0.9) });
        app.root.addChild(camera);

        let moveForward = false, steerLeft = false, steerRight = false;
        document.getElementById('gasBtn').addEventListener('touchstart', () => moveForward = true);
        document.getElementById('gasBtn').addEventListener('touchend', () => moveForward = false);
        document.getElementById('leftBtn').addEventListener('touchstart', () => steerLeft = true);
        document.getElementById('leftBtn').addEventListener('touchend', () => steerLeft = false);
        document.getElementById('rightBtn').addEventListener('touchstart', () => steerRight = true);
        document.getElementById('rightBtn').addEventListener('touchend', () => steerRight = false);

        app.on('update', (dt) => {
            if (moveForward) car.translateLocal(0, 0, -12 * dt);
            if (steerLeft) car.rotateLocal(0, 100 * dt, 0);
            if (steerRight) car.rotateLocal(0, -100 * dt, 0);
            const carPos = car.getPosition();
            camera.setPosition(carPos.x, carPos.y + 4, carPos.z + 8);
            camera.lookAt(carPos);
        });

        window.addEventListener('resize', () => app.resizeCanvas());
    </script>
</body>
</html>
